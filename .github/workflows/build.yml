# Builds Last Grounds for the browser (WebGL), Windows, Linux and Android with GameCI.
#
#  - Manual run (Actions tab > "Build & Release" > Run workflow): builds everything,
#    uploads the builds as artifacts and updates the web version on GitHub Pages.
#  - Push a tag like v1.0.0: same, plus a GitHub Release with the zips and, if
#    configured, an upload to itch.io.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity_lic.ulf (see README > Building)
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
# Optional, Android release signing (without them the APK uses Unity's debug key,
# which is fine for itch.io and sideloading; Google Play needs your own keystore):
#   ANDROID_KEYSTORE_BASE64  base64 of your .keystore file
#   ANDROID_KEYSTORE_PASS    ANDROID_KEYALIAS_NAME    ANDROID_KEYALIAS_PASS
# Optional, for itch.io:
#   secret   BUTLER_API_KEY   https://itch.io/user/settings/api-keys
#   variable ITCH_GAME        e.g. miguelrg14/last-grounds

name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [WebGL, StandaloneWindows64, StandaloneLinux64, Android]
    steps:
      # The Unity Docker image is large; make room on the runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # Generates data, prefabs and scenes (LastGroundsBuilder) and builds the player.
      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: LastGrounds
          buildMethod: LastGrounds.EditorTools.CIBuild.Build
          versioning: Custom
          version: ${{ steps.version.outputs.value }}
          # Android only (ignored by the other platforms)
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: lastgrounds.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LastGrounds-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14

  pages:
    name: Deploy web version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LastGrounds-WebGL
          path: webgl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webgl/LastGrounds
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip builds
        shell: bash
        run: |
          set -e
          V="$GITHUB_REF_NAME"
          chmod +x artifacts/LastGrounds-StandaloneLinux64/LastGrounds.x86_64 || true
          (cd artifacts/LastGrounds-StandaloneWindows64 && zip -qr "../../LastGrounds-$V-Windows.zip" . -x '*DoNotShip*')
          (cd artifacts/LastGrounds-StandaloneLinux64 && zip -qr "../../LastGrounds-$V-Linux.zip" . -x '*DoNotShip*')
          (cd artifacts/LastGrounds-WebGL/LastGrounds && zip -qr "../../../LastGrounds-$V-Web.zip" .)
          cp artifacts/LastGrounds-Android/LastGrounds.apk "LastGrounds-$V-Android.apk"
          ls -lh *.zip *.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.apk
          generate_release_notes: true

  itch:
    name: Publish to itch.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.ITCH_GAME != ''
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install butler
        shell: bash
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V

      - name: Push channels
        shell: bash
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          chmod +x artifacts/LastGrounds-StandaloneLinux64/LastGrounds.x86_64 || true
          rm -rf artifacts/*/*DoNotShip*
          ./butler/butler push artifacts/LastGrounds-WebGL/LastGrounds "$ITCH_GAME:html5" --userversion "$V"
          ./butler/butler push artifacts/LastGrounds-StandaloneWindows64 "$ITCH_GAME:windows" --userversion "$V"
          ./butler/butler push artifacts/LastGrounds-StandaloneLinux64 "$ITCH_GAME:linux" --userversion "$V"
          ./butler/butler push artifacts/LastGrounds-Android/LastGrounds.apk "$ITCH_GAME:android" --userversion "$V"
